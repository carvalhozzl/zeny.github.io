name: Publicar servidor da IA (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Só roda depois que os segredos do Cloudflare forem configurados.
    if: ${{ vars.DEPLOY_SERVER == 'true' }}
    env:
      HAS_STRIPE: ${{ secrets.STRIPE_SECRET_KEY != '' }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      # Aceita o ID da conta mesmo colado com espaços, barras ou o endereço inteiro do painel.
      - name: Conferir ID da conta
        env:
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ID=$(printf '%s' "$RAW_ACCOUNT_ID" | tr 'A-F' 'a-f' | grep -oE '[a-f0-9]{32}' | head -n1)
          if [ -z "$ID" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID não tem um ID de conta válido (32 letras e números)."; exit 1; fi
          echo "::add-mask::$ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
      # Aceita o token puro ou o comando de teste "curl ... Bearer TOKEN" que a Cloudflare mostra.
      - name: Conferir token da Cloudflare
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if printf '%s' "$RAW_TOKEN" | grep -q 'Bearer'; then
            TOKEN=$(printf '%s' "$RAW_TOKEN" | grep -oE 'Bearer[[:space:]]+[A-Za-z0-9_-]+' | head -n1 | awk '{print $2}')
          else
            TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]"')
          fi
          if [ -z "$TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN vazio ou inválido."; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Publicar Worker
        run: npx wrangler deploy
      - name: Gravar chave da API como segredo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Aceita a chave colada com espaços ou texto a mais.
          KEY=$(printf '%s' "$ANTHROPIC_API_KEY" | grep -oE 'sk-ant-[A-Za-z0-9_-]+' | head -n1)
          if [ -z "$KEY" ]; then echo "::error::ANTHROPIC_API_KEY não parece uma chave da Anthropic (sk-ant-...)."; exit 1; fi
          echo "::add-mask::$KEY"
          printf '%s' "$KEY" | npx wrangler secret put ANTHROPIC_API_KEY
      - name: Gravar chaves da Stripe como segredo
        if: ${{ env.HAS_STRIPE == 'true' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          echo "$STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then echo "$STRIPE_WEBHOOK_SECRET" | npx wrangler secret put STRIPE_WEBHOOK_SECRET; fi
      - name: Testar servidor no ar
        run: |
          URL="https://zeny-server.danieli-breves.workers.dev"
          sleep 5
          echo "Saúde: $(curl -fsS "$URL/health")"
          RESP=$(curl -sS -X POST "$URL/chat" -H 'Origin: https://carvalhozzl.github.io' -H 'content-type: application/json' \
            -d '{"message":"gastei 30 no uber e recebi 100 de um cliente","history":[],"context":"{\"hoje\":\"2026-09-25\"}","clientId":"00000000000000000000000000000000"}')
          echo "Resposta da IA: $RESP"
          echo "$RESP" | grep -q '"reply"' || { echo "::error::A IA não respondeu como esperado."; exit 1; }
