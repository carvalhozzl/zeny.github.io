name: App Android

on:
  push:
    branches: [main]
    paths: ['web/**', 'assets/**', 'scripts/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # O runner ubuntu-latest já vem com o Android SDK instalado (ANDROID_HOME).

      - name: Instalar dependências
        run: npm ci

      - name: Configurar servidor da IA
        run: ./scripts/set-server-url.sh "${{ vars.ZENY_SERVER_URL }}"

      - name: Gerar projeto Android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npx cap add android
          npm run android:prepare

      - name: APK de teste (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: zeny-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Pacote para a Play Store: só roda se os segredos de assinatura existirem.
      - name: Pacote da Play Store (AAB assinado)
        id: release
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/zeny.jks"
          ./gradlew bundleRelease --no-daemon
          jarsigner -keystore "$RUNNER_TEMP/zeny.jks" -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm "$RUNNER_TEMP/zeny.jks"

      - uses: actions/upload-artifact@v4
        if: ${{ steps.release.outcome == 'success' }}
        with:
          name: zeny-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
